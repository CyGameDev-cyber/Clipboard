<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Jacking Awareness Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .btn { padding: 10px 15px; margin: 5px; border: none; cursor: pointer; border-radius: 6px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-clear-log { background: #6b7280; color: white; }
    .btn-clear-input { background: #9ca3af; color: white; }
    .log { border: 1px solid #ddd; padding: 10px; height: 150px; overflow-y: auto; margin-top: 15px; font-size: 14px; width: 80%; max-width: 500px; margin-left: auto; margin-right: auto; }
    .footer { text-align: center; font-size: 12px; color: #444; margin-top: 30px; }
    #pasteField { width: 80%; max-width: 400px; padding: 8px; margin-top: 10px; display: block; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <h2>Clipboard Jacking Awareness Demo</h2>
  <p>This demo shows how clipboard jacking can silently replace copied text with malicious content.</p>

  <button class="btn btn-primary" onclick="copyAddress()">Copy Sample BTC Address</button>
  <button class="btn btn-danger" onclick="toggleAttack()" id="attackBtn">Enable Attack Simulation</button>

  <p>Paste here to test:</p>
  <input type="text" id="pasteField" placeholder="Paste something here...">
  <div style="margin: 10px 0;">
    <button class="btn btn-clear-log" onclick="clearLog()">Clear Log</button>
    <button class="btn btn-clear-input" onclick="clearInput()">Clear Input</button>
  </div>

  <div class="log" id="log"></div>

  <div class="footer">© 2025 Abdul Basit Rotimi - All rights reserved.</div>

  <script>
    const victimAddress = "1BoatSLRHtKNngkdXEeobR76b53LETtpyT";
    const attackerAddress = "1HackerScam12345XyzAttackWallet999";
    let attackEnabled = false;

    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += `<div>${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function copyAddress() {
      navigator.clipboard.writeText(victimAddress).then(() => {
        log(`Copied victim address: ${victimAddress}`);
      });
    }

    function toggleAttack() {
      attackEnabled = !attackEnabled;
      document.getElementById("attackBtn").innerText = attackEnabled ? "Disable Simulation" : "Enable Attack Simulation";
      log(attackEnabled ? "⚠️ Attack simulation ENABLED" : "✅ Attack simulation DISABLED");
    }

    function clearLog() {
      document.getElementById("log").innerHTML = '';
    }

    function clearInput() {
      document.getElementById("pasteField").value = '';
    }

    document.getElementById("pasteField").addEventListener("paste", (e) => {
      if (attackEnabled) {
        e.preventDefault();
        const pastedData = attackerAddress;
        e.target.value = pastedData;
        log(`⚠️ Clipboard hijacked! Pasted attacker address: ${attackerAddress}`);
      } else {
        log("✅ Normal paste event.");
      }
    });
  </script>
</body>
</html>
